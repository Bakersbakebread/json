  <script>
    // Sets the palette before first paint; App.vue takes over once mounted.
    // json-palette holds the saved choice. With none, or "auto", a light OS gets
    // Peach (0) and a dark one gets Night (2). bgs follow src/palettes.ts order.
    (function () {
      var bgs = ['#fff1e0', '#d6f5e3', '#14122b', '#ffd6e8', '#1a2fd0', '#e4dbff', '#0f2a20'];
      var i = matchMedia('(prefers-color-scheme: dark)').matches ? 2 : 0;
      try {
        var saved = localStorage.getItem('json-palette');
        if (saved !== null && saved !== 'auto' && bgs[Number(saved)]) i = Number(saved);
      } catch (e) {}
      document.documentElement.dataset.palette = i;
      document.querySelector('meta[name="theme-color"]').content = bgs[i];
    })();
  </script>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
